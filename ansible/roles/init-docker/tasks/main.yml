---
- name: create-keyrings-dir
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: download-docker-gpg-key
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
    force: true

- name: dearmor-docker-gpg-key
  command: gpg --dearmor --yes --output /etc/apt/keyrings/docker.gpg /etc/apt/keyrings/docker.asc
  args:
    creates: /etc/apt/keyrings/docker.gpg

- name: add-docker-apt-repo
  apt_repository:
    repo: |-
      deb [signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu
        {{ ansible_facts["distribution_release"] }} stable
    state: present
    filename: docker

- name: install-docker
  apt:
    pkg:
      - docker-ce
      - docker-ce-cli
      - docker-compose-plugin
    state: latest
    update_cache: true

- name: configure-docker-daemon
  copy:
    src: daemon.json
    dest: /etc/docker/daemon.json
    mode: '0644'
  notify: restart-docker

- name: start-docker
  systemd:
    name: docker
    enabled: yes
    state: started
